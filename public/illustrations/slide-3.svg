<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Parcels ready to send and a bag of groceries to fetch">
  <title>Pasugo and pabili</title>
  <!--
    Slide 3 — "Pasugo and pabili".

    Both errands in one frame: the parcel going out (pasugo) on the left, the
    grocery bag coming back (pabili) on the right, and the hand-off between
    them. This is the same parcel motif as the crest-coloured placeholder
    scene, drawn per slide instead of shared.
  -->
  <defs>
    <linearGradient id="s3-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33419a" />
      <stop offset="1" stop-color="#222b70" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#s3-field)" />
  <circle cx="200" cy="128" r="126" fill="#3f4dab" opacity="0.4" />

  <!-- Ground -->
  <ellipse cx="200" cy="206" rx="158" ry="12" fill="#151b52" opacity="0.5" />

  <!-- Parcel going out (pasugo) -->
  <g transform="rotate(-6 102 154)">
    <rect x="82" y="94" width="60" height="36" rx="6" fill="#f4f4f7" />
    <rect x="106" y="94" width="12" height="36" fill="#d9dae8" />
    <rect x="58" y="122" width="88" height="62" rx="8" fill="#ffc72c" />
    <rect x="96" y="122" width="12" height="62" fill="#e3a715" />
    <rect x="68" y="140" width="26" height="20" rx="4" fill="#e1251b" />
    <rect x="73" y="146" width="16" height="3" rx="1.5" fill="#f4f4f7" />
    <rect x="73" y="152" width="10" height="3" rx="1.5" fill="#f4f4f7" opacity="0.85" />
  </g>

  <!-- Hand-off: parcels on the move -->
  <g stroke="#ffc72c" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <line x1="152" y1="118" x2="186" y2="112" />
    <line x1="156" y1="136" x2="190" y2="130" />
    <line x1="160" y1="154" x2="184" y2="150" />
  </g>
  <path d="M196 108 L222 118 L196 128 Z" fill="#ffc72c" opacity="0.9" />

  <!-- Groceries coming back (pabili) -->
  <path d="M282 106 C282 82, 330 82, 330 106" fill="none" stroke="#f4f4f7" stroke-width="8" stroke-linecap="round" />
  <path d="M264 108 L348 108 L338 200 Q305 210 274 200 Z" fill="#f4f4f7" />
  <path d="M264 108 L348 108 L346 132 L266 132 Z" fill="#d9dae8" />
  <!-- Produce at the mouth of the bag -->
  <path d="M290 106 C292 86, 300 78, 306 80 C304 92, 300 102, 296 108 Z" fill="#2f8f83" />
  <path d="M318 106 L318 84 Q318 76 326 76 L326 106 Z" fill="#1626c8" />
  <rect x="314" y="70" width="16" height="10" rx="3" fill="#e1251b" />
  <path d="M302 96 L332 92" fill="none" stroke="#e3a715" stroke-width="9" stroke-linecap="round" />
  <!-- Bag seam -->
  <path d="M272 152 L340 148" fill="none" stroke="#d9dae8" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Sparkles -->
  <path d="M0 -12 C1.6 -3.6, 3.6 -1.6, 12 0 C3.6 1.6, 1.6 3.6, 0 12 C-1.6 3.6, -3.6 1.6, -12 0 C-3.6 -1.6, -1.6 -3.6, 0 -12 Z" transform="translate(46 58) scale(0.75)" fill="#f4f4f7" opacity="0.85" />
  <path d="M0 -12 C1.6 -3.6, 3.6 -1.6, 12 0 C3.6 1.6, 1.6 3.6, 0 12 C-1.6 3.6, -3.6 1.6, -12 0 C-3.6 -1.6, -1.6 -3.6, 0 -12 Z" transform="translate(360 60) scale(0.9)" fill="#ffc72c" />
  <path d="M0 -12 C1.6 -3.6, 3.6 -1.6, 12 0 C3.6 1.6, 1.6 3.6, 0 12 C-1.6 3.6, -3.6 1.6, -12 0 C-3.6 -1.6, -1.6 -3.6, 0 -12 Z" transform="translate(210 46) scale(0.55)" fill="#f4f4f7" opacity="0.7" />
</svg>
